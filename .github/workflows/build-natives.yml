name: Build ihmc-optimizer-wrapper natives

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: [ubuntu-22.04]
    strategy:
      matrix:
        platform: [x86_64, arm64]
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - name: Pull repo
        run: |
          git reset --hard
          git pull
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install build-essential crossbuild-essential-arm64 libboost-dev cmake git swig -y
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library (arm64)
        if: matrix.platform == 'arm64'
        run: |
          LINUX_CROSS_COMPILE_ARM=1 bash cppbuild.bash
      - name: Compile native library (x86_64)
        if: matrix.platform == 'x86_64'
        run: |
          bash cppbuild.bash
      - name: Commit generated java and native libraries
        uses: EndBug/add-and-commit@v9
        with:
          add: '*.java *.so' # Only commit generated java from Linux
          author_name: ihmc-rosie
          author_email: rosie@ihmc.us
          message: 'Rebuild natives for Linux'
          push: true
  build-windows:
    runs-on: [windows-2022]
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Pull repo
        run: |
          git reset --hard
          git pull
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Boost 1.87.0
        uses: MarkusJx/install-boost@v2
        id: install-boost
        with:
          boost_version: 1.87.0
          platform_version: 2022
          toolset: msvc
      - name: Compile native library
        run: |
          export BOOST_ROOT=${{ steps.install-boost.outputs.BOOST_ROOT }}
          bash cppbuild.bash
      - name: Commit native libraries
        uses: EndBug/add-and-commit@v9
        with:
          add: '*.dll' # Only commit generated java from Linux
          author_name: ihmc-rosie
          author_email: rosie@ihmc.us
          message: 'Rebuild natives for Windows'
          push: true
  build-macos:
    runs-on: [macos-15-intel]
    needs: [build-windows]
    strategy:
      matrix:
        platform: [x86_64, arm64]
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - name: Pull repo
        run: |
          git reset --hard
          git pull
      - name: Install dependencies
        run: |
          brew install coreutils
          brew install boost
          sudo xcode-select --switch /Applications/Xcode_16.app
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library (arm64)
        if: matrix.platform == 'arm64'
        run: |
          MAC_CROSS_COMPILE_ARM=1 bash cppbuild.bash
      - name: Compile native library (x86_64)
        if: matrix.platform == 'x86_64'
        run: |
          bash cppbuild.bash
      - name: Commit generated java and native libraries
        uses: EndBug/add-and-commit@v9
        with:
          add: '*.dylib' # Only commit generated java from Linux
          author_name: ihmc-rosie
          author_email: rosie@ihmc.us
          message: 'Rebuild natives for macOS'
          push: true